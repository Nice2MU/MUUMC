# ==========================================================
# Minecraft Server & Bot Configuration for muu-mc
# ==========================================================

server:
  host: "cynthia-literally.tun.ply.gg"
  port: 16520
  version: false # false = auto-detect server version dynamically (1.16 - 1.21+)
  auth: "microsoft" # offline (cracked/local) or microsoft

bot:
  username: "muumiu.hub@gmail.com"
  view_distance: "far"
  check_timeout_interval: 30000
  physics:
    sprint: true
    sneak: false

viewer:
  enabled: false
  port: 3007
  first_person: true

auto_reconnect:
  enabled: true
  max_retries: 10
  retry_delay_ms: 5000

autonomous:
  enabled: true
  idle_timeout_ms: 2000
  explore_radius: 16
  gather_drops: true
  auto_eat: true
  auto_sleep: true
  replant_saplings: true

voice_bridge:
  # Native Minecraft Plugin Messaging Channel ('muu:voice' on port 25565) is active!
  # WebSocket (Port 25570) is disabled since port 25565 handles everything directly:
  enabled: false
  host: "127.0.0.1"
  ws_port: 25570
  auth_token: "muu_secure_voice_bridge_token_8899"
  auto_reconnect: false
  reconnect_delay_ms: 5000
