# ==========================================================
# AI Provider Configuration for muu-mc (Agent 2 & In-Game Chat)
# ==========================================================

active_provider: "openrouter" # ollama or openrouter

ollama:
  base_url: "http://127.0.0.1:11434"
  model: "qwen2.5-coder:3b"
  num_ctx: 16384
  temperature: 0.2
  timeout_ms: 60000
  keep_alive: "1h"

openrouter:
  api_key: "" # Set OPENROUTER_API_KEY env var or auto-resolved from MuumiuLLM
  base_url: "https://openrouter.ai/api/v1"
  model: "minimax/minimax-m3:free"
  temperature: 0.2
  max_tokens: 500
  timeout_ms: 60000

sandbox:
  step_timeout_ms: 60000
  total_task_timeout_ms: 120000
  auto_unwrap: true
  max_self_healing_attempts: 1

cache:
  enabled: true
  similarity_threshold: 0.85
